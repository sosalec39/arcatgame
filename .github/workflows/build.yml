name: Build AR Cat Game IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 15
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Install ldid (for TrollStore pseudo-signing)
        run: brew install ldid

      - name: Build (no signing)
        run: |
          xcodebuild build \
            -project ARCatGame/ARCatGame.xcodeproj \
            -scheme ARCatGame \
            -destination "generic/platform=iOS" \
            -configuration Release \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            -derivedDataPath DerivedData \
            | xcpretty || true

      - name: Package IPA for TrollStore
        run: |
          APP=$(find DerivedData -name "*.app" -not -path "*/PlugIns/*" | head -1)
          echo "Found app: $APP"

          # Pseudo-sign binary with ldid (required for TrollStore)
          ldid -S "$APP/$(basename $APP .app)"

          # Pack into .ipa
          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -r ARCatGame.ipa Payload/
          echo "IPA size: $(du -h ARCatGame.ipa | cut -f1)"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ARCatGame-ipa
          path: ARCatGame.ipa
          retention-days: 14
